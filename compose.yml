services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: dailybrief
      POSTGRES_USER: dailybrief
      POSTGRES_PASSWORD: dailybrief
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dailybrief-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dailybrief -d dailybrief"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  dailybrief-data:
