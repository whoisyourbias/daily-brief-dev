spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.batch.BatchAutoConfiguration
  datasource:
    driver-class-name: ${DAILYBRIEF_DB_DRIVER:software.amazon.dsql.jdbc.DSQLConnector}
    hikari:
      minimum-idle: 0
      maximum-pool-size: 2
      connection-timeout: 3000
      initialization-fail-timeout: -1
  flyway:
    enabled: false
dailybrief:
  scheduling:
    enabled: false
server:
  forward-headers-strategy: none
  servlet:
    session:
      cookie:
        secure: true
